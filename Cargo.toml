[package]
name = "wpp"
version = "0.1.0"
edition = "2021"
description = "WhatsApp from the terminal"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt", "macros", "time", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
thiserror = "2"
qrcode = "0.14"
quircs = "0.10"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
crossterm = "0.28"
dirs = "6"
rusqlite = { version = "0.39.0", features = ["bundled"] }
whatsapp-rust = {
  git = "https://github.com/oxidezap/whatsapp-rust",
  rev = "f8165f2",
  version = "0.7",
  default-features = false,
  features = [
    "signal",
    "sqlite-storage",
    "tokio-native",
    "tokio-runtime",
    "tokio-transport",
    "ureq-client",
  ],
}

whatsapp-rust-chat-store = {
  git = "https://github.com/oxidezap/whatsapp-rust",
  rev = "f8165f2",
  version = "0.1.0",
}