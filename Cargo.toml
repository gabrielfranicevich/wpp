[package]
name = "wpp"
version = "0.1.0"
edition = "2021"
description = "WhatsApp from the terminal"

[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt", "macros", "time", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
thiserror = "2"
qrcode = "0.14"
quircs = "0.10"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
crossterm = "0.28"
dirs = "6"
futures-util = "0.3"
rust_socketio = { version = "0.6", features = ["async"] }
rusqlite = { version = "0.39.0", features = ["bundled"] }
whatsapp-rust = { version = "0.7", default-features = false, features = [
  "signal",
  "sqlite-storage",
  "tokio-native",
  "tokio-runtime",
  "tokio-transport",
  "ureq-client",
] }

[dev-dependencies]
divan = { version = "5.0.2", package = "codspeed-divan-compat" }

[[bench]]
name = "core"
harness = false
